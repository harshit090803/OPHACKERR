name: Migrate StudyPilot to Anthropic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Anthropic migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          server_path = Path('backend/server.py')
          req_path = Path('backend/requirements.txt')
          server = server_path.read_text(encoding='utf-8')

          # Remove old SSL/httpx setup and replace it with Anthropic configuration.
          server = server.replace('import httpx\n', '')
          server = server.replace('import edge_tts\n', 'import edge_tts\nfrom anthropic import AsyncAnthropic\n', 1)

          server = re.sub(
              r'# --- SSL / env first \(Windows cert issues\) ---.*?(?=from fastapi import)',
              '', server, count=1, flags=re.S
          )
          server = re.sub(
              r'# Ollama API \(cloud or local\).*?_httpx_client = httpx\.AsyncClient\(verify=_ssl_verify, timeout=_httpx_timeout\)\n',
              '# Anthropic Claude configuration\nANTHROPIC_API_KEY = os.environ.get("ANTHROPIC_API_KEY") or ""\nANTHROPIC_MODEL = os.environ.get("ANTHROPIC_MODEL", "claude-sonnet-4-5")\nanthropic_client = None\n# Male teacher voice (matches avatar) — free Microsoft Edge neural TTS\nEDGE_TTS_VOICE = os.environ.get("EDGE_TTS_VOICE", "en-US-GuyNeural")\n',
              server, count=1, flags=re.S
          )

          llm = '''async def _llm_text(system: str, user: str, max_tokens: int = 8000) -> str:
              """Call Anthropic Claude through the official Python SDK."""
              global anthropic_client
              if not ANTHROPIC_API_KEY:
                  raise RuntimeError("ANTHROPIC_API_KEY is not configured.")
              if anthropic_client is None:
                  anthropic_client = AsyncAnthropic(
                      api_key=ANTHROPIC_API_KEY,
                      timeout=600.0,
                      max_retries=2,
                  )
              response = await anthropic_client.messages.create(
                  model=ANTHROPIC_MODEL,
                  max_tokens=max_tokens,
                  temperature=0.4,
                  system=system,
                  messages=[{"role": "user", "content": user}],
              )
              text = "".join(
                  block.text for block in response.content
                  if getattr(block, "type", None) == "text"
              ).strip()
              if not text:
                  raise RuntimeError("Anthropic returned an empty response.")
              return text


          async def _llm_json(system: str, user: str, max_tokens: int = 8000) -> dict:
              """Call Anthropic and parse JSON from the response."""
              text = await _llm_text(system, user, max_tokens=max_tokens)
              return _extract_json(text)
          '''
          server, n = re.subn(
              r'async def _llm_text\(system: str, user: str, max_tokens: int = 8000\) -> str:.*?(?=\n\nasync def generate_study_content)',
              llm.rstrip(), server, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('Could not locate existing LLM functions')

          server = server.replace(
              '"""StudyPilot AI backend - PDF to Quiz + Flashcards using DeepSeek."""',
              '"""StudyPilot AI backend - PDF to Quiz + Flashcards using Anthropic Claude."""', 1
          )

          server = server.replace(
              '''@app.on_event("shutdown")
          async def shutdown_db_client():
              client.close()''',
              '''@app.on_event("shutdown")
          async def shutdown_clients():
              global anthropic_client
              if anthropic_client is not None:
                  await anthropic_client.close()
              client.close()''', 1
          )

          server_path.write_text(server, encoding='utf-8')

          req = [x for x in req_path.read_text(encoding='utf-8').splitlines()
                 if not x.lower().startswith('httpx') and not x.lower().startswith('anthropic')]
          req.append('anthropic>=0.104.1')
          req_path.write_text('\n'.join(req) + '\n', encoding='utf-8')

          Path('backend/.env.example').write_text('''# MongoDB
MONGO_URL="mongodb://localhost:27017"
DB_NAME="studypilot"
CORS_ORIGINS="*"

# Anthropic Claude
ANTHROPIC_API_KEY="your-anthropic-api-key"
ANTHROPIC_MODEL="claude-sonnet-4-5"

# Microsoft Edge neural TTS
EDGE_TTS_VOICE="en-US-GuyNeural"
''', encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile backend/server.py
          if grep -nE 'OLLAMA_|ollama\.com|/api/chat|import httpx|_httpx_' backend/server.py; then exit 1; fi
          grep -q '^anthropic' backend/requirements.txt
          grep -q 'ANTHROPIC_API_KEY' backend/server.py

      - name: Commit final migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/requirements.txt backend/.env.example
          git rm .github/workflows/migrate-ollama-to-anthropic.yml
          git commit -m "Migrate StudyPilot from Ollama to Anthropic"
          git push
